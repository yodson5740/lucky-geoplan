name: Android Lucky GeoPlan
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparer le projet Android
        run: |
          unzip -q -o LuckyGeoPlan-android.zip -d build
          cd build
          npm ci --no-audit --no-fund
          WEB_SRC=.. npm run sync
      - name: Cle de signature
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > build/android/app/upload-keystore.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Compiler
        working-directory: build/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi
      - name: Rassembler les fichiers
        run: |
          mkdir -p out
          N=${{ github.run_number }}
          if [ "$SIGNED" = "1" ]; then
            cp build/android/app/build/outputs/bundle/release/app-release.aab "out/LuckyGeoPlan-1.0.$N.aab"
            cp build/android/app/build/outputs/apk/release/app-release.apk "out/LuckyGeoPlan-1.0.$N.apk"
          else
            cp build/android/app/build/outputs/apk/debug/app-debug.apk "out/LuckyGeoPlan-test-1.0.$N.apk"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyGeoPlan-1.0.${{ github.run_number }}
          path: out/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lucky GeoPlan 1.0.${{ github.run_number }}
          files: out/*
          prerelease: ${{ env.SIGNED != '1' }}
